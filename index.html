<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app">
      <div class="header">
        <div class="header-top">
          <h1 class="title">Tosin et <em>LH Taskify</em></h1>
          <div class="date-label">THU, MAR 13</div>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar">
          <div class="progress-fill"  style="width: 0%;"></div>
        </div>
      </div>

      <form class="input-row todo-form">
        <input
          class="task-input todo-input"
          type="text"
          placeholder="add a new task..."
          maxlength="120"
        />

        <button class="add-btn">add task</button>
      </form>

      <div class="toast-message"></div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">all</button>

        <button class="filter-btn" data-filter="active">active</button>

        <button class="filter-btn" data-filter="completed">completed</button>

        <button class="filter-btn clear-completed">clear</button>
      </div>

      <ul class="tasks todo-list"></ul>
    </main>

    <script src="index.js"></script>
  </body>
</html>
